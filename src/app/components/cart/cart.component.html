<div class="cart-sidebar" style="position: fixed; top: 0; right: 0; width: 350px; height: 100vh; background: white; box-shadow: -2px 0 5px rgba(0,0,0,0.1); padding: 20px; z-index: 1000; overflow-y: auto; box-sizing: border-box;">

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
    <h3 style="margin: 0; font-size: 18px; color: #333;">Tu Carrito</h3>
    <button (click)="cart.toggle(false)" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 0; color: #666;">&times;</button>
  </div>

  <div *ngIf="cartItems.length > 0; else emptyCart" style="display: flex; flex-direction: column; gap: 20px;">

    <div *ngFor="let item of cartItems" style="display: flex; align-items: center; gap: 15px;">

      <img *ngIf="item.product.image" [src]="item.product.image" style="width: 60px; height: 60px; object-fit: contain; flex-shrink: 0; border-radius: 4px; border: 1px solid #f5f5f5;">

      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px;">

        <div style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #333;">
          {{ item.product.title }}
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">

          <div style="display: flex; align-items: center; border: 1px solid #ddd; border-radius: 4px; overflow: hidden;">
            <button (click)="cart.update(item.product.id, item.quantity - 1)" style="background: #f9f9f9; border: none; padding: 4px 10px; cursor: pointer; font-weight: bold; border-right: 1px solid #ddd; color: #333;">-</button>
            <span style="padding: 0 12px; font-size: 13px; min-width: 15px; text-align: center; color: #333;">{{ item.quantity }}</span>
            <button (click)="cart.update(item.product.id, item.quantity + 1)" style="background: #f9f9f9; border: none; padding: 4px 10px; cursor: pointer; font-weight: bold; border-left: 1px solid #ddd; color: #333;">+</button>
          </div>

          <div style="font-weight: bold; font-size: 14px; color: #000;">
            ${{ (item.product.price * item.quantity) | number:'1.2-2' }}
          </div>

        </div>
      </div>
    </div>
  </div>

  <ng-template #emptyCart>
    <div style="text-align: center; margin-top: 40px; color: #888;">
      <p>Tu carrito está vacío.</p>
    </div>
  </ng-template>

</div>
