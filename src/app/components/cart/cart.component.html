<div *ngIf="cart.isOpen$ | async">
  <div class="overlay" (click)="cart.toggle(false)"></div>
  <div class="panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>Tu Carrito</h2>
      <button (click)="cart.toggle(false)" style="background:none; border:none; font-size: 20px; cursor: pointer;">&times;</button>
    </div>

    <ng-container *ngIf="cart.cart$ | async as cartItems">

      <div style="overflow-y: auto; flex-grow: 1;">
        <div *ngIf="cartItems.length === 0" style="text-align: center; color: gray; margin-top: 50px;">
          Carrito Vacío
        </div>

        <div *ngFor="let item of cartItems" class="item" style="display: flex; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">

          <img *ngIf="item.image" [src]="item.image" style="width: 50px; height: 50px; object-fit: contain; margin-right: 15px;">

          <div style="flex-grow: 1;">
            <div style="font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 150px;">
              {{ item.title }}
            </div>

            <div style="margin-top: 5px;">
              <button (click)="cart.update(item.id, item.quantity - 1)">-</button>
              <span style="margin: 0 10px;">{{ item.quantity }}</span>
              <button (click)="cart.update(item.id, item.quantity + 1)">+</button>
            </div>
          </div>

          <div style="font-weight: bold;">
            ${{ (item.price * item.quantity) | number:'1.2-2' }}
          </div>

        </div>
      </div>

      <div class="footer" *ngIf="cartItems.length > 0">
        <h3>Total: ${{ cart.getTotal() | number:'1.2-2' }}</h3>
        <button class="btn-pay" (click)="checkout()">Finalizar Compra</button>
      </div>

    </ng-container>
  </div>
</div>
